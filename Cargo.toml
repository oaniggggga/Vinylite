[workspace]
members = [
    "crates/vinylite-cli",
    "crates/vinylite-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
vinylite-core = { path = "crates/vinylite-core" }
clap = { version = "4.5.53", features = ["derive"] }
thiserror = "2.0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
